name: Stage 1 checks

on:
  push:
    branches:
      - feat/athar-stage-1-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stage-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci@127.0.0.1:5432/athar?schema=public
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create an ephemeral build secret
        run: echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
